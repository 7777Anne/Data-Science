name: industrial-rag-tests
on:
  push:
    branches: [main]
    paths:
      - "industrial-rag/**"
      - ".github/workflows/industrial-rag-tests.yml"
  pull_request:
    paths:
      - "industrial-rag/**"
      - ".github/workflows/industrial-rag-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: industrial-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests
      - run: python evaluate.py
